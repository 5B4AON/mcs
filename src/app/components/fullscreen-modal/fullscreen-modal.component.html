<div class="fs-modal-overlay" [class.vintage]="vintage()" [style.height.px]="viewport.height()" [style.top.px]="viewport.offsetTop()">
  <div #fullscreenDialog class="fs-modal" role="dialog" aria-modal="true"
       aria-label="Full-screen conversation" tabindex="-1"
       (keydown)="onDialogKeydown($event)">

    <!-- Top toolbar: close, level meter, WPM pills, clear, kebab menu -->
    @if (!vintage()) {
    <app-fs-toolbar
      [inputMode]="inputMode"
      [lensMode]="lensMode"
      [vintageAllowed]="vintageAllowed"
      (vintageRequested)="startVintage()"
      (lensToggle)="toggleLens()"
      (closeRequest)="close()"
      (inputModeChange)="setInputMode($event)"
      (helpRequested)="requestHelp()"
      (symbolsRefRequested)="requestSymbolsRef()"
      (settingsRequested)="settingsRequested.emit()"
      (wizardRequested)="wizardRequested.emit()"
      (presetsRequested)="presetsRequested.emit()">
    </app-fs-toolbar>
    }

    <!-- Main content area -->
    <div class="fs-body"
         [style.background]="settings.modalDisplay().rxBackground">

      <!-- The main screen's loop / feedback warning is hidden behind this view, so it is shown here too -->
      @if (loopDetection.loopDetected()) {
        <div class="fs-loop-warning" role="alert">
          <span class="fs-loop-warning-icon" aria-hidden="true">&#x26A0;</span>
          <span class="fs-loop-warning-text">{{ loopDetection.loopMessage() }}</span>
          <button type="button" class="fs-loop-warning-dismiss" (click)="loopDetection.clearLoop()"
                  title="Dismiss and re-enable outputs" aria-label="Dismiss and re-enable outputs">&times;</button>
        </div>
      }

      <!-- Send practice: the same prompt box as the main screen, always visible above the output -->
      @if (sendPromptShown) {
        <app-send-prompt class="fs-send-prompt" />
      } @else if (cwScopeShown) {
        <app-cw-scope class="fs-cw-scope" />
      }

      <!-- The text size is auto-fitted to the body box; the slider value is a multiplier (24 = 1x) -->
      <div class="fs-fit" [class.touch-on]="touchKeysShown" [class.prompt-on]="sendPromptShown" [class.scope-on]="cwScopeShown" [class.audio-on]="audioFile.loaded() && !vintage()"
           [class.regular-only]="regularOnlyFont"
           [style.--fs-mult]="settings.modalDisplay().fontSize / fontSizeBase"
           [style.--fs-space]="settings.modalDisplay().lineSpacing"
           [style.fontFamily]="fontStack"
           [style.fontWeight]="fontWeight">
        <app-fs-conversation-view [viewportKeyboardOpen]="viewport.keyboardOpen()"
                             [inputMode]="inputMode"
                             [lensMode]="lensMode"
                             (inputModeChange)="setInputMode($event)"
                             (replayRequested)="replayRequested.emit($event)"
                             (bookRequested)="bookRequested.emit()"></app-fs-conversation-view>
      </div>

    </div>
  </div>
</div>
