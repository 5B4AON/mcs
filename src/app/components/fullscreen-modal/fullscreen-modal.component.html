<div class="fs-modal-overlay" [style.height.px]="viewport.height()" [style.top.px]="viewport.offsetTop()">
  <div #fullscreenDialog class="fs-modal" role="dialog" aria-modal="true"
       aria-label="Full-screen conversation" tabindex="-1"
       (keydown)="onDialogKeydown($event)">

    <!-- Top toolbar: close, level meter, WPM pills, clear, kebab menu -->
    <app-fs-toolbar
      [inputMode]="inputMode"
      [lensMode]="lensMode"
      (lensToggle)="toggleLens()"
      (closeRequest)="close()"
      (inputModeChange)="setInputMode($event)"
      (helpRequested)="requestHelp()"
      (symbolsRefRequested)="requestSymbolsRef()"
      (settingsRequested)="settingsRequested.emit()"
      (wizardRequested)="wizardRequested.emit()"
      (presetsRequested)="presetsRequested.emit()">
    </app-fs-toolbar>

    <!-- Main content area -->
    <div class="fs-body"
         [style.background]="settings.modalDisplay().rxBackground">

      <!-- The text size is auto-fitted to the body box; the slider value is a multiplier (24 = 1x) -->
      <div class="fs-fit" [class.touch-on]="touchKeysShown"
           [style.--fs-mult]="settings.modalDisplay().fontSize / fontSizeBase"
           [style.--fs-space]="settings.modalDisplay().lineSpacing"
           [style.fontFamily]="fontStack"
           [style.fontWeight]="settings.modalDisplay().fontBold ? 'bold' : 'normal'">
        <app-fs-conversation-view [viewportKeyboardOpen]="viewport.keyboardOpen()"
                             [inputMode]="inputMode"
                             [lensMode]="lensMode"
                             (inputModeChange)="setInputMode($event)"></app-fs-conversation-view>
      </div>

    </div>
  </div>
</div>
