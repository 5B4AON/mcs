<div class="kebab-step-ctl" role="group" aria-label="RX decoder speed, adaptive"
     title="RX decoder speed (adaptive): the decoder tracks the speed of the incoming signal. The round arrow restores the default start speed and starts tracking again.">
  <span class="kebab-step-lead" aria-hidden="true">RX<svg xmlns="http://www.w3.org/2000/svg" width="36" height="18" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="8" r="2.2" fill="currentColor" stroke="none"/><rect x="14" y="5.8" width="14" height="4.4" rx="2.2" fill="currentColor" stroke="none"/><circle cx="35" cy="8" r="2.2" fill="currentColor" stroke="none"/><rect x="40" y="5.8" width="6" height="4.4" rx="2.2" fill="currentColor" stroke="none"/><line x1="3" y1="18" x2="45" y2="18"/><polyline points="7 14.5 3 18 7 21.5"/><polyline points="41 14.5 45 18 41 21.5"/></svg></span>
  <span class="kebab-step-value">{{ decoder.rxEstimatedWpm() }}<span class="kebab-step-unit">wpm</span></span>
  <button type="button" class="kebab-step-btn" (click)="resetDecoderSpeed('rx')"
          title="Reset RX speed to the default" aria-label="Reset RX speed to the default"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
</div>
<div class="kebab-step-ctl" role="group" aria-label="TX decoder speed, adaptive"
     title="TX decoder speed (adaptive): the decoder tracks the speed of the incoming signal. The round arrow restores the default start speed and starts tracking again.">
  <span class="kebab-step-lead" aria-hidden="true">TX<svg xmlns="http://www.w3.org/2000/svg" width="36" height="18" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="8" r="2.2" fill="currentColor" stroke="none"/><rect x="14" y="5.8" width="14" height="4.4" rx="2.2" fill="currentColor" stroke="none"/><circle cx="35" cy="8" r="2.2" fill="currentColor" stroke="none"/><rect x="40" y="5.8" width="6" height="4.4" rx="2.2" fill="currentColor" stroke="none"/><line x1="3" y1="18" x2="45" y2="18"/><polyline points="7 14.5 3 18 7 21.5"/><polyline points="41 14.5 45 18 41 21.5"/></svg></span>
  <span class="kebab-step-value">{{ decoder.txEstimatedWpm() }}<span class="kebab-step-unit">wpm</span></span>
  <button type="button" class="kebab-step-btn" (click)="resetDecoderSpeed('tx')"
          title="Reset TX speed to the default" aria-label="Reset TX speed to the default"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
</div>
<div class="kebab-step-ctl" role="group" aria-label="Encoder speed" title="Encoder speed (WPM): the keyboard encoder plays text at this speed">
  <span class="kebab-step-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="6" y1="9" x2="6.01" y2="9"/><line x1="10" y1="9" x2="10.01" y2="9"/><line x1="14" y1="9" x2="14.01" y2="9"/><line x1="18" y1="9" x2="18.01" y2="9"/><line x1="6" y1="12.5" x2="6.01" y2="12.5"/><line x1="10" y1="12.5" x2="10.01" y2="12.5"/><line x1="14" y1="12.5" x2="14.01" y2="12.5"/><line x1="18" y1="12.5" x2="18.01" y2="12.5"/><line x1="8" y1="16" x2="16" y2="16"/></svg></span>
  <button type="button" class="kebab-step-btn" aria-label="Decrease encoder speed"
          [disabled]="settings.settings().encoderWpm <= MIN_WPM" (click)="nudge('encoderWpm', -1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <span class="kebab-step-value">{{ settings.settings().encoderWpm }}<span class="kebab-step-unit">wpm</span></span>
  <button type="button" class="kebab-step-btn" aria-label="Increase encoder speed"
          [disabled]="settings.settings().encoderWpm >= MAX_WPM" (click)="nudge('encoderWpm', 1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/></svg></button>
</div>
<div class="kebab-step-ctl" role="group" aria-label="Keyer speed" title="Keyer speed (WPM): the speed of the paddle and keyer timing">
  <span class="kebab-step-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="18" width="20" height="3.5" rx="1"/><line x1="13" y1="18" x2="13" y2="13.5"/><line x1="3" y1="13.5" x2="21" y2="13.5"/><line x1="6" y1="13.5" x2="6" y2="9"/><path d="M2.5 8.5a3.5 2 0 0 1 7 0z" fill="currentColor"/><line x1="19" y1="13.5" x2="19" y2="18"/></svg></span>
  <button type="button" class="kebab-step-btn" aria-label="Decrease keyer speed"
          [disabled]="settings.settings().keyerWpm <= MIN_WPM" (click)="nudge('keyerWpm', -1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <span class="kebab-step-value">{{ settings.settings().keyerWpm }}<span class="kebab-step-unit">wpm</span></span>
  <button type="button" class="kebab-step-btn" aria-label="Increase keyer speed"
          [disabled]="settings.settings().keyerWpm >= MAX_WPM" (click)="nudge('keyerWpm', 1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/></svg></button>
</div>
