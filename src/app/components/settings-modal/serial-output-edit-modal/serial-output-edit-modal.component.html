<app-mapping-edit-dialog [title]="(editIndex >= 0 ? 'Edit' : 'Add') + ' Serial Output Mapping'"
                         ariaLabel="Edit Serial Output Mapping"
                         (confirmed)="save()" (cancelled)="cancelled.emit()">
  <app-serial-output-mapping-editor [mapping]="mapping" [editIndex]="editIndex" [allMappings]="allMappings"
                                    [serialInputMappings]="serialInputMappings" />
</app-mapping-edit-dialog>
