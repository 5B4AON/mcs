<app-mapping-edit-dialog [title]="(editIndex >= 0 ? 'Edit' : 'Add') + ' MIDI Input Mapping'"
                         ariaLabel="Edit MIDI Input Mapping" [canDelete]="editIndex >= 0"
                         (confirmed)="save()" (cancelled)="cancelled.emit()" (deleted)="deleted.emit()">
  <app-midi-input-mapping-editor [mapping]="mapping" [editIndex]="editIndex"
                                 [midiDevices]="midiDevices" [allMappings]="allMappings" />
</app-mapping-edit-dialog>
