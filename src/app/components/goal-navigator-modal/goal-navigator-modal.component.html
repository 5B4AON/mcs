<div class="wizard-overlay" (appBackdropClick)="closed.emit()">
  <div #dialog class="wizard-modal" role="dialog" aria-modal="true" aria-labelledby="goal-modal-title" tabindex="-1"
       (click)="$event.stopPropagation()" (keydown)="onKeydown($event)">
    <div class="wizard-modal-header">
      <h2 id="goal-modal-title"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="20" x2="15" y2="9"/><line x1="14" y1="10" x2="16" y2="12" stroke-width="3.2"/><path d="M17.500 3l.9 2.100 2.100.9-2.100.9-.9 2.100-.9-2.100-2.100-.9 2.100-.9z" fill="currentColor" stroke="none"/><path d="M8 3.500l.6 1.400 1.400.6-1.400.6-.6 1.400-.6-1.400-1.400-.6 1.400-.6z" fill="currentColor" stroke="none"/><path d="M19 14.500l.5 1.100 1.100.5-1.100.5-.5 1.100-.5-1.100-1.100-.5 1.100-.5z" fill="currentColor" stroke="none"/></svg> Setup Wizard</h2>
      <div class="wizard-header-actions">
        <button type="button" class="settings-action-btn" (click)="presetsRequested.emit()" title="Presets: save, import, export, apply" aria-label="Presets">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button type="button" class="settings-close-btn" (click)="closed.emit()" title="Close Setup Wizard" aria-label="Close Setup Wizard">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <p class="wizard-intro">What do you want to do? Pick a goal and the wizard guides you through the settings it needs.</p>
    <div class="wizard-modal-body">
      <app-goal-navigator (goalSelected)="goalSelected.emit($event)"
                          (wizardRequested)="wizardRequested.emit($event)"></app-goal-navigator>
    </div>
  </div>
</div>
