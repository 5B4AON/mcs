@if (part === 'load') {
  @if (file.loaded()) {
    <button type="button" class="afp-btn"
            (mousedown)="$event.preventDefault()" (click)="file.stop()"
            title="Stop and unload the file, and go back to listening to the microphone"
            aria-label="Stop and unload the file">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/>
        <polyline points="14 2 14 7 19 7"/>
        <line x1="8.2" y1="14" x2="8.2" y2="16"/>
        <line x1="10.1" y1="12.5" x2="10.1" y2="17.5"/>
        <line x1="12" y1="11" x2="12" y2="19"/>
        <line x1="13.9" y1="12.5" x2="13.9" y2="17.5"/>
        <line x1="15.8" y1="14" x2="15.8" y2="16"/>
        <!-- The diagonal stroke over the icon means stop (a wide line in the scope's colour keeps the icon from showing through it) -->
        <line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#181c22" stroke-width="4.4"/>
        <line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke-width="2"/>
      </svg>
    </button>
  } @else if (!hideLoad && file.canLoad()) {
    <button type="button" class="afp-btn" [disabled]="file.loading()"
            (mousedown)="$event.preventDefault()" (click)="file.pick()"
            title="Load an audio file to decode" aria-label="Load an audio file to decode">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/>
        <polyline points="14 2 14 7 19 7"/>
        <line x1="8.2" y1="14" x2="8.2" y2="16"/>
        <line x1="10.1" y1="12.5" x2="10.1" y2="17.5"/>
        <line x1="12" y1="11" x2="12" y2="19"/>
        <line x1="13.9" y1="12.5" x2="13.9" y2="17.5"/>
        <line x1="15.8" y1="14" x2="15.8" y2="16"/>
      </svg>
    </button>
  }
} @else if (file.loaded()) {
  <div class="afp-bar" role="group" [attr.aria-label]="'Audio file player: ' + file.fileName()" [title]="file.fileName()">
    <button type="button" class="afp-btn"
            (mousedown)="$event.preventDefault()" (click)="file.playing() ? file.pause() : file.play()"
            [title]="file.playing() ? 'Pause' : 'Play'" [attr.aria-label]="file.playing() ? 'Pause' : 'Play'">
      @if (file.playing()) {
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14"/><rect x="13.5" y="5" width="3.5" height="14"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"/></svg>
      }
    </button>
    <div class="afp-seek">
      <input type="range" class="afp-slider" min="0" step="any"
             [max]="file.seekable() ? file.duration() : 1" [value]="sliderValue" [disabled]="!file.seekable()"
             (input)="onDrag($event)" (change)="onSeek($event)"
             [attr.aria-label]="'Position in ' + file.fileName()">
      <div class="afp-times">
        <span class="afp-time">{{ clock(sliderValue) }}</span>
        <span class="afp-time">{{ file.seekable() ? clock(file.duration()) : '--:--' }}</span>
      </div>
    </div>
  </div>
}
