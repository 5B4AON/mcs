<div class="cw-scope" role="group" aria-label="CW detector scope">
  <canvas #canvas class="cw-scope-canvas" aria-hidden="true"></canvas>
  <div class="cw-scope-status">
    <span class="cw-scope-text">{{ statusText() }}</span>
    <span class="cw-scope-legend" aria-hidden="true">
      <span class="lg lg-hi"></span>on
      <span class="lg lg-lo"></span>off
      <span class="lg lg-win"></span>window
    </span>
  </div>
</div>
