<div class="confirm-overlay" (appBackdropClick)="cancel()">
  <div #dialog class="confirm-dialog" (click)="$event.stopPropagation()" role="alertdialog"
       aria-modal="true" aria-labelledby="confirm-dialog-title" tabindex="-1"
       (keydown)="onDialogKeydown($event)">

    <!-- Header -->
    <div class="confirm-header">
      <h3 id="confirm-dialog-title">{{ title }}</h3>
    </div>

    <!-- Body -->
    <div class="confirm-body">
      <p>{{ message }}</p>
    </div>

    <!-- Actions -->
    <div class="confirm-actions">
      @if (!singleAction) {
        <button type="button" class="pill-btn cancel-btn" (click)="cancel()">{{ cancelLabel }}</button>
      }
      <button type="button" class="pill-btn ok-btn" [class.pill-danger]="danger" [class.pill-accent]="!danger" (click)="confirm()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
