<div class="midi-mapping-list">
  @for (mapping of mappings; track $index) {
    <div class="midi-mapping-row" [class.midi-mapping-row-disabled]="!mapping.enabled">
      <label class="midi-mapping-enable">
        <input type="checkbox" [checked]="mapping.enabled" (change)="onEnabled($index, $event)">
      </label>
      <span class="row-body" (click)="edit.emit($index)">
        <ng-container *ngTemplateOutlet="rowTemplate ?? null; context: { $implicit: mapping, index: $index }" />
      </span>
      <span class="midi-mapping-spacer"></span>
      <button type="button" class="midi-mapping-btn midi-mapping-btn-edit" (click)="edit.emit($index)" title="Edit">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
    </div>
  }
</div>
<button type="button" class="midi-mapping-add-btn" (click)="add.emit()">{{ addLabel }}</button>
