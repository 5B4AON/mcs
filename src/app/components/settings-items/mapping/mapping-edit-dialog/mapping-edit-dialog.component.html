<div class="md-overlay" (appBackdropClick)="cancelled.emit()">
  <div #dialog class="md-dialog" (click)="$event.stopPropagation()" role="dialog"
       aria-modal="true" tabindex="-1" (keydown)="onKeydown($event)" [attr.aria-label]="ariaLabel || title">

    <div class="md-header">
      <h3>{{ title }}</h3>
      <button type="button" class="md-close-btn" (click)="cancelled.emit()" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="md-body">
      <ng-content></ng-content>
    </div>

    <div class="md-actions">
      @if (canDelete) {
        <button type="button" class="pill-btn pill-danger" (click)="deleted.emit()" title="Delete this mapping">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete
        </button>
      }
      <button type="button" class="pill-btn" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="pill-btn pill-primary" (click)="confirmed.emit()">OK</button>
    </div>
  </div>
</div>
