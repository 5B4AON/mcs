<div class="md-overlay" (appBackdropClick)="cancelled.emit()" [appBackClose]="backClose">
  <div #dialog class="md-dialog" (click)="$event.stopPropagation()" role="dialog"
       aria-modal="true" tabindex="-1" (keydown)="onKeydown($event)" [attr.aria-label]="ariaLabel || title">

    <div class="md-header">
      <h3>{{ title }}</h3>
      <button type="button" class="md-close-btn" (click)="cancelled.emit()" title="Close" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="md-body">
      <ng-content></ng-content>
    </div>

    <div class="md-actions">
      <button type="button" class="pill-btn" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="pill-btn pill-primary" (click)="confirmed.emit()">OK</button>
    </div>
  </div>
</div>
