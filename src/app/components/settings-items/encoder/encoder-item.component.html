<!-- Keyboard Encoder -->
@if (part === 'mode') {
<app-item-shell cardId="encoder-mode-card" title="Send mode" [mode]="mode">
  <label>Send mode:
    <select [value]="s().encoderMode" (change)="onSettingChange('encoderMode', $event)">
      <option value="enter" [selected]="s().encoderMode === 'enter'">Send on Enter</option>
      <option value="live" [selected]="s().encoderMode === 'live'">Live</option>
      @if (s().encoderMode === 'practice') {
        <option value="practice" selected>Copy practice (current)</option>
      }
      @if (s().encoderMode === 'send-practice') {
        <option value="send-practice" selected>Send practice (current)</option>
      }
    </select>
  </label>
  <div class="keyer-hint">
    Send on Enter plays after you press Enter. Live plays each letter as you type.
    <app-help-link-button section="s3-1" label="Help: sending modes" />
  </div>
</app-item-shell>
} @else {
<app-item-shell cardId="encoder-card" title="Keyboard Encoder" [mode]="mode">
  <span item-badges class="source-badge" [class.source-rx]="s().encoderSource === 'rx'" [class.source-tx]="s().encoderSource === 'tx'">{{ s().encoderSource === 'rx' ? 'RX' : 'TX' }}</span>

  <div class="cw-hint">
    Plays the text you type as Morse.
    <app-help-link-button section="s3-1" label="Help: typing and sending modes" />
  </div>

  <label>Used for:
    <select [value]="s().encoderSource" (change)="onSettingChange('encoderSource', $event)">
      <option value="rx">RX &mdash; received morse</option>
      <option value="tx">TX &mdash; transmitted morse</option>
    </select>
    <app-help-link-button section="s5-1" label="Help: RX and TX" />
  </label>

  <div class="card-section-divider"></div>

  <label>Name:
    <input type="text" [value]="s().encoderName"
           (input)="onSettingChange('encoderName', $event)"
           placeholder="e.g. callsign (optional)"
           maxlength="20">
  </label>
  <div class="keyer-hint">Optional. A new name starts a new line.</div>

  <label>Color:
    <div class="card-color-row">
      <input type="color" class="card-color-picker"
             [ngModel]="s().encoderColor || '#ffffff'"
             (ngModelChange)="scope.update({ encoderColor: $event })">
      @if (s().encoderColor) {
        <button type="button" class="card-color-clear"
                (click)="scope.update({ encoderColor: '' })" title="Clear color">&#10005;</button>
      }
      <span class="card-color-preview" [style.color]="s().encoderColor || 'inherit'">Sample</span>
    </div>
  </label>
  <div class="keyer-hint">Optional. Colours this input's text.</div>
</app-item-shell>
}
