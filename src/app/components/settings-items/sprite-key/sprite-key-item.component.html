<!-- Straight-Key Sprite -->
<app-item-shell cardId="sprite-key-card" title="Straight-Key Sprite" [mode]="mode"
                [enabled]="s().spriteButtonEnabled"
                (enabledChange)="scope.update({ spriteButtonEnabled: $event })">
  <span item-badges>
    <span class="source-badge" [class.source-rx]="s().spriteSource === 'rx'" [class.source-tx]="s().spriteSource === 'tx'">{{ s().spriteSource === 'rx' ? 'RX' : 'TX' }}</span>
  </span>

<div class="cw-hint">
  Shows an on-screen straight key. Hold for a dash, tap for a dot.
  <app-help-link-button section="s4-6" label="Help: on-screen key" />
</div>

<label>Used for:
  <select [value]="s().spriteSource" (change)="onSettingChange('spriteSource', $event)">
    <option value="rx">RX &mdash; received morse</option>
    <option value="tx">TX &mdash; transmitted morse</option>
  </select>
  <app-help-link-button section="s5-1" label="Help: RX and TX" />
</label>

<div class="card-section-divider"></div>

<label>Name:
  <input type="text" [value]="s().spriteName"
         (input)="onSettingChange('spriteName', $event)"
         placeholder="e.g. callsign (optional)"
         maxlength="20">
</label>

<label>Colour:
  <div class="card-color-row">
    <input type="color" class="color-pill"
           [ngModel]="s().spriteColor || '#ffffff'"
           (ngModelChange)="scope.update({ spriteColor: $event })">
    @if (s().spriteColor) {
      <button type="button" class="card-color-clear"
              (click)="scope.update({ spriteColor: '' })" title="Clear colour">&#10005;</button>
    }
  </div>
</label>

<div class="card-section-divider"></div>

<div class="cw-hint">Also press down when these inputs key:</div>

<div class="settings-row">
  <label class="settings-checkbox">
    <input type="checkbox" [checked]="s().spriteAnimateKeyboard"
           (change)="onAnimateChange('spriteAnimateKeyboard', $event)">
    Keyboard straight key
  </label>
</div>
<div class="settings-row">
  <label class="settings-checkbox">
    <input type="checkbox" [checked]="s().spriteAnimateEncoder"
           (change)="onAnimateChange('spriteAnimateEncoder', $event)">
    Keyboard encoder
  </label>
</div>
<div class="settings-row">
  <label class="settings-checkbox">
    <input type="checkbox" [checked]="s().spriteAnimateMouse"
           (change)="onAnimateChange('spriteAnimateMouse', $event)">
    Mouse straight key
  </label>
</div>
<div class="settings-row">
  <label class="settings-checkbox">
    <input type="checkbox" [checked]="s().spriteAnimateMidi"
           (change)="onAnimateChange('spriteAnimateMidi', $event)">
    MIDI straight key
  </label>
</div>
<div class="settings-row">
  <label class="settings-checkbox">
    <input type="checkbox" [checked]="s().spriteAnimateSerial"
           (change)="onAnimateChange('spriteAnimateSerial', $event)">
    Serial straight key
  </label>
</div>
<div class="settings-row">
  <label class="settings-checkbox">
    <input type="checkbox" [checked]="s().spriteAnimateMic"
           (change)="onAnimateChange('spriteAnimateMic', $event)">
    Straight key via mic
  </label>
</div>
</app-item-shell>
