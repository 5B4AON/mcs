<!-- Text Blurring -->
<app-item-shell cardId="text-blur-card" title="Text Blurring" [mode]="mode"
                [enabled]="s().textBlurEnabled"
                (enabledChange)="onEnabledChange($event)">
  <div class="cw-hint">
    Blurs text so you can copy by ear. Hold the eye button to peek.
    <app-help-link-button section="s8-4" label="Help: text blurring" />
  </div>
  <label>
    Applies to:
    <select [value]="s().textBlurAppliesTo"
            (change)="onAppliesToChange($event)">
      <option value="rx">RX Only</option>
      <option value="tx">TX Only</option>
      <option value="both">Both RX and TX</option>
    </select>
  </label>
</app-item-shell>
