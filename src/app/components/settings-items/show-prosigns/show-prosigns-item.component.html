<!-- Show Prosigns -->
<app-item-shell cardId="show-prosigns-card" title="Show Prosigns" [mode]="mode"
                [enabled]="s().showProsigns"
                (enabledChange)="onEnabledChange($event)">
  <div class="cw-hint">
    Shows prosign names such as <span class="prosign-example">&lt;AR&gt;</span> instead of punctuation such as +.
    <app-help-link-button section="s8-6" label="Help: prosigns" />
  </div>
</app-item-shell>
